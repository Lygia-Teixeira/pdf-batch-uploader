<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Demo Multi-tenant</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d2330; --muted:#5b6475; --card:#fff; --line:#d9dde4; --accent:#2f5bd3; --ok:#1d7a46; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:16px; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  main { max-width:760px; margin:24px auto; padding:0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px; margin-bottom:18px; }
  label { display:block; margin:10px 0 4px; color:var(--muted); font-size:13px; }
  input, select, button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  .tenant-badge { padding:4px 10px; border-radius:99px; background:#e8eefc; font-weight:600; }
  .hidden { display:none; }
  .ok { color:var(--ok); font-weight:600; }
  .err { color:var(--err); font-weight:600; }
  .note { color:var(--muted); font-size:13px; }
  ul { padding-left:18px; }
</style>
</head>
<body>
<header>
  <h1>Portal Demo — envio de documentos</h1>
  <div id="session-bar" class="hidden">
    Tenant ativo: <span id="active-tenant" class="tenant-badge"></span>
  </div>
</header>
<main>
  <!-- Login simulado: nenhuma credencial é pedida nem armazenada. Na ferramenta, o
       login é sempre feito manualmente pelo operador no navegador. -->
  <section id="login-panel">
    <h2>Entrar</h2>
    <p class="note">Ambiente de demonstração local. Clique para simular o login manual do operador.</p>
    <button id="login-btn" type="button">Entrar (demo)</button>
  </section>

  <div id="app" class="hidden">
    <section>
      <h2>Trocar tenant</h2>
      <label for="tenant-picker">Tenant</label>
      <select id="tenant-picker">
        <option value="">— selecione —</option>
        <option value="alfa">EMPRESA ALFA LTDA</option>
        <option value="alfa-filial">EMPRESA ALFA LTDA FILIAL NORTE</option>
        <option value="beta">EMPRESA BETA S.A.</option>
        <option value="gama">COOPERATIVA GAMA</option>
      </select>
      <button id="tenant-activate" type="button">Ativar</button>
    </section>

    <section>
      <h2>Enviar documento</h2>
      <form id="upload-form">
        <label for="file-input">Arquivo PDF</label>
        <input id="file-input" name="file" type="file" accept="application/pdf">

        <label for="period">Competência (AAAA-MM)</label>
        <input id="period" name="period" type="text" placeholder="2026-09" pattern="\d{4}-\d{2}">

        <label for="doc-type">Tipo de documento</label>
        <select id="doc-type" name="doc_type">
          <option value="">— selecione —</option>
          <option value="MONTHLY">Mensal</option>
          <option value="ANNUAL_BONUS">13º / gratificação anual</option>
          <option value="VACATION">Férias</option>
        </select>

        <label for="audience">Público</label>
        <select id="audience" name="audience">
          <option value="">— selecione —</option>
          <option value="ACTIVE">Ativos</option>
          <option value="RETIRED">Aposentados</option>
          <option value="ALL">Todos</option>
        </select>

        <label for="match-by">Identificação do titular no documento</label>
        <select id="match-by" name="match_by">
          <option value="EMPLOYEE_ID">Matrícula</option>
          <option value="TAX_ID">Documento fiscal</option>
        </select>

        <label><input id="annual-bonus" type="checkbox"> Documento de 13º</label>

        <p><button id="submit-btn" type="button">Enviar</button></p>
      </form>
      <div id="result" aria-live="polite"></div>
      <p class="note">Nada sai do seu navegador: o "envio" é apenas registrado nesta página.</p>
    </section>

    <section>
      <h2>Recibos desta sessão</h2>
      <ul id="receipts"></ul>
    </section>
  </div>
</main>
<script>
(function () {
  "use strict";
  var state = { tenant: "EMPRESA BETA S.A." };   // começa propositalmente em outro tenant
  var $ = function (id) { return document.getElementById(id); };

  function render() { $("active-tenant").textContent = state.tenant; }
  function show(msg, cls) { var r = $("result"); r.textContent = ""; var p = document.createElement("p"); p.className = cls; p.textContent = msg; r.appendChild(p); }

  $("login-btn").addEventListener("click", function () {
    $("login-panel").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("session-bar").classList.remove("hidden");
    render();
  });

  $("tenant-activate").addEventListener("click", function () {
    var sel = $("tenant-picker");
    if (!sel.value) { show("Selecione um tenant.", "err"); return; }
    var label = sel.options[sel.selectedIndex].text;
    // Simula a latência de recarregar o contexto do tenant.
    $("active-tenant").textContent = "carregando…";
    setTimeout(function () { state.tenant = label; render(); $("result").textContent = ""; }, 250);
  });

  $("file-input").addEventListener("change", function () { $("result").textContent = ""; });

  // Botão do tipo "button": o formulário nunca é submetido de verdade.
  $("submit-btn").addEventListener("click", function () {
    var f = $("file-input").files[0];
    var period = $("period").value.trim();
    if (!f) { show("Nenhum arquivo selecionado.", "err"); return; }
    if (!/\.pdf$/i.test(f.name)) { show("Apenas PDF.", "err"); return; }
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(period)) { show("Competência inválida.", "err"); return; }
    if (!$("doc-type").value || !$("audience").value) { show("Preencha tipo e público.", "err"); return; }
    $("result").textContent = "";
    var tenant = state.tenant;
    setTimeout(function () {
      show("Recebido: " + f.name + " — processamento iniciado (demo)", "ok");
      var li = document.createElement("li");
      li.textContent = tenant + " | " + period + " | " + $("doc-type").value + "/" + $("audience").value + " | " + f.name;
      $("receipts").appendChild(li);
      $("upload-form").reset();
    }, 300);
  });
})();
</script>
</body>
</html>
